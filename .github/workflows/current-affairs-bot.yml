name: Telegram Content Bot

on:
  workflow_dispatch:
  schedule:
    # Run every 2 hours, offset from the busiest :00 slot on GitHub Actions.
    - cron: "7 */2 * * *"

permissions:
  contents: write

concurrency:
  group: telegram-content-bot
  cancel-in-progress: false

jobs:
  post-content:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    defaults:
      run:
        working-directory: telegram_bot

    env:
      CONTENT_MODE: ${{ vars.CONTENT_MODE || 'books' }}
      TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN || secrets.BOT_TOKEN }}
      TELEGRAM_CHANNEL_ID: ${{ secrets.TELEGRAM_CHANNEL_ID || secrets.CHANNEL_ID }}
      TELEGRAM_GROUP_ID: ${{ secrets.TELEGRAM_GROUP_ID || secrets.GROUP_ID }}
      TELEGRAM_REQUIRE_GROUP: ${{ vars.TELEGRAM_REQUIRE_GROUP || 'false' }}
      TELEGRAM_BRAND_NAME: ${{ vars.TELEGRAM_BRAND_NAME || 'Quote Bot Daily' }}
      TELEGRAM_CHANNEL_REF: ${{ vars.TELEGRAM_CHANNEL_REF || '' }}
      TELEGRAM_GROUP_REF: ${{ vars.TELEGRAM_GROUP_REF || '' }}
      TELEGRAM_CALL_TO_ACTION: ${{ vars.TELEGRAM_CALL_TO_ACTION || 'Join for daily motivational quotes from books, mindset lessons, and shareable self-growth posts.' }}
      TELEGRAM_CHANNEL_DESCRIPTION: ${{ vars.TELEGRAM_CHANNEL_DESCRIPTION || 'Daily motivational quotes from books, mindset lessons, self growth insights, and shareable inspiration posts.' }}
      TELEGRAM_DISCOVERY_KEYWORDS: ${{ vars.TELEGRAM_DISCOVERY_KEYWORDS || 'motivational quotes, book quotes, self growth, mindset motivation, daily inspiration, success habits' }}
      GROUP_ANSWER_DELAY_MINUTES: ${{ vars.GROUP_ANSWER_DELAY_MINUTES || '30' }}
      GROUP_DISCUSSION_CALL_TO_ACTION: ${{ vars.GROUP_DISCUSSION_CALL_TO_ACTION || 'Reply with your reason or one keyword you would revise from this topic.' }}
      NEWS_API_KEY: ${{ secrets.NEWS_API_KEY || secrets.NEWSAPI_KEY }}
      NEWSDATA_API_KEY: ${{ secrets.NEWSDATA_API_KEY }}
      GROQ_API_KEY: ${{ secrets.GROQ_API_KEY || '' }}
      OPENAI_API_KEY: ${{ secrets.GROQ_API_KEY || secrets.OPENAI_API_KEY || secrets.LLM_API_KEY }}
      OPENAI_BASE_URL: ${{ secrets.OPENAI_BASE_URL || secrets.LLM_BASE_URL || secrets.GROQ_BASE_URL || vars.OPENAI_BASE_URL || vars.LLM_BASE_URL || vars.GROQ_BASE_URL || 'https://api.groq.com/openai/v1' }}
      OPENAI_MODEL: ${{ secrets.OPENAI_MODEL || secrets.LLM_MODEL || secrets.GROQ_MODEL || vars.OPENAI_MODEL || vars.LLM_MODEL || vars.GROQ_MODEL || 'your-groq-model-name' }}
      CURRENT_AFFAIRS_QUERY: ${{ vars.CURRENT_AFFAIRS_QUERY || 'India OR government OR parliament OR economy OR summit OR diplomacy OR science OR sports' }}
      NEWSDATA_INDIA_QUERY: ${{ vars.NEWSDATA_INDIA_QUERY || 'India OR government OR parliament OR economy OR summit OR diplomacy OR science OR sports' }}
      NEWSDATA_WORLD_QUERY: ${{ vars.NEWSDATA_WORLD_QUERY || 'government OR parliament OR economy OR summit OR diplomacy OR science OR sports' }}
      NEWSDATA_INDIA_COUNTRY: ${{ vars.NEWSDATA_INDIA_COUNTRY || 'in' }}
      NEWSDATA_API_URL: ${{ vars.NEWSDATA_API_URL || 'https://newsdata.io/api/1/latest' }}
      NEWS_PAGE_SIZE: ${{ vars.NEWS_PAGE_SIZE || '10' }}
      MAX_ARTICLES_PER_CYCLE: ${{ vars.MAX_ARTICLES_PER_CYCLE || '2' }}
      REQUEST_TIMEOUT_SECONDS: ${{ vars.REQUEST_TIMEOUT_SECONDS || '30' }}
      TELEGRAM_SEND_MCQ_POLLS: ${{ vars.TELEGRAM_SEND_MCQ_POLLS || 'false' }}
      MCQS_PER_ARTICLE: ${{ vars.MCQS_PER_ARTICLE || '0' }}
      BOOKS_SOURCE_DIR: ${{ vars.BOOKS_SOURCE_DIR || 'data/books' }}
      BOOKS_CHUNK_SIZE: ${{ vars.BOOKS_CHUNK_SIZE || '2200' }}
      BOOKS_CHUNK_OVERLAP: ${{ vars.BOOKS_CHUNK_OVERLAP || '250' }}
      BOOKS_MAX_CHUNKS_PER_DOCUMENT: ${{ vars.BOOKS_MAX_CHUNKS_PER_DOCUMENT || '20' }}
      STATE_FILE: data/posted_articles.json
      GROUP_REVEAL_STATE_FILE: data/pending_group_reveals.json

    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Validate required configuration
        shell: bash
        run: |
          missing=0
          for name in TELEGRAM_BOT_TOKEN TELEGRAM_CHANNEL_ID OPENAI_API_KEY; do
            if [ -z "${!name}" ]; then
              echo "Missing required secret or variable: $name"
              missing=1
            fi
          done
          if [ "${OPENAI_MODEL}" = "your-groq-model-name" ]; then
            echo "Set OPENAI_MODEL, LLM_MODEL, or GROQ_MODEL to your Groq model name."
            missing=1
          fi
          echo "Running in CONTENT_MODE=${CONTENT_MODE}"
          if [ "${CONTENT_MODE}" = "news" ]; then
            if [ -z "${NEWS_API_KEY}" ] && [ -z "${NEWSDATA_API_KEY}" ]; then
              echo "Set at least one news provider key: NEWS_API_KEY or NEWSDATA_API_KEY."
              missing=1
            fi
          elif [ "${CONTENT_MODE}" = "books" ]; then
            if [ ! -d "${BOOKS_SOURCE_DIR}" ]; then
              echo "BOOKS_SOURCE_DIR does not exist: ${BOOKS_SOURCE_DIR}"
              missing=1
            fi
          else
            echo "Unsupported CONTENT_MODE: ${CONTENT_MODE}"
            missing=1
          fi
          if [ "$missing" -ne 0 ]; then
            exit 1
          fi
          if [ -n "${GROQ_API_KEY:-}" ] && [ "${OPENAI_BASE_URL}" = "https://api.openai.com/v1" ]; then
            echo "GROQ_API_KEY is set but OPENAI_BASE_URL is still the OpenAI default. Set LLM_BASE_URL or GROQ_BASE_URL to https://api.groq.com/openai/v1."
            exit 1
          fi

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install dependencies
        run: pip install -r requirements.txt

      - name: Run bot cycle
        run: python main.py --once

      - name: Summarize posting result
        shell: bash
        run: |
          if git diff --quiet -- data; then
            {
              echo "## Telegram Content Bot"
              echo
              echo "No new data state changed in this run."
              echo
              echo "That usually means there were no fresh items and no due answer reveals to send."
            } >> "$GITHUB_STEP_SUMMARY"
          else
            {
              echo "## Telegram Content Bot"
              echo
              echo "Bot state changed in this run."
              echo
              echo '```'
              git diff --numstat -- data
              echo '```'
            } >> "$GITHUB_STEP_SUMMARY"
          fi

      - name: Commit updated posted-article state
        shell: bash
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add data
          if git diff --staged --quiet; then
            echo "No state changes to commit."
            exit 0
          fi
          git commit -m "chore: update telegram bot state [skip ci]"
          git push
