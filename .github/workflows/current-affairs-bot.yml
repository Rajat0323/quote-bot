name: Telegram Content Bot

on:
  workflow_dispatch:
  schedule:
    # Run every 2 hours, offset from the busiest :00 slot on GitHub Actions.
    - cron: "7 */2 * * *"

permissions:
  contents: write

concurrency:
  group: telegram-content-bot
  cancel-in-progress: false

jobs:
  post-content:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    defaults:
      run:
        working-directory: telegram_bot

    env:
      TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN || secrets.BOT_TOKEN }}
      TELEGRAM_CHANNEL_ID: ${{ secrets.TELEGRAM_CHANNEL_ID || secrets.CHANNEL_ID }}
      TELEGRAM_GROUP_ID: ${{ secrets.TELEGRAM_GROUP_ID || secrets.GROUP_ID }}
      NEWS_API_KEY: ${{ secrets.NEWS_API_KEY || secrets.NEWSAPI_KEY }}
      NEWSDATA_API_KEY: ${{ secrets.NEWSDATA_API_KEY }}
      GROQ_API_KEY: ${{ secrets.GROQ_API_KEY || '' }}
      OPENAI_API_KEY: ${{ secrets.GROQ_API_KEY || secrets.OPENAI_API_KEY || secrets.LLM_API_KEY }}
      STATE_FILE: data/posted_articles.json
      GROUP_REVEAL_STATE_FILE: data/pending_group_reveals.json

    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Load repository config
        shell: bash
        run: |
          if [ ! -f "github-actions.env" ]; then
            echo "Missing telegram_bot/github-actions.env"
            exit 1
          fi
          grep -vE '^[[:space:]]*(#|$)' github-actions.env >> "$GITHUB_ENV"

      - name: Validate required configuration
        shell: bash
        run: |
          missing=0
          for name in TELEGRAM_BOT_TOKEN TELEGRAM_CHANNEL_ID OPENAI_API_KEY; do
            if [ -z "${!name}" ]; then
              echo "Missing required secret: $name"
              missing=1
            fi
          done
          if [ "${OPENAI_MODEL}" = "your_groq_model_name" ]; then
            echo "Set OPENAI_MODEL in telegram_bot/github-actions.env to your Groq model name."
            missing=1
          fi
          echo "Running in CONTENT_MODE=${CONTENT_MODE}"
          if [ "${CONTENT_MODE}" = "news" ]; then
            if [ -z "${NEWS_API_KEY}" ] && [ -z "${NEWSDATA_API_KEY}" ]; then
              echo "Set at least one news provider key: NEWS_API_KEY or NEWSDATA_API_KEY."
              missing=1
            fi
          elif [ "${CONTENT_MODE}" = "books" ]; then
            if [ ! -d "${BOOKS_SOURCE_DIR}" ]; then
              echo "BOOKS_SOURCE_DIR does not exist: ${BOOKS_SOURCE_DIR}"
              missing=1
            fi
          else
            echo "Unsupported CONTENT_MODE: ${CONTENT_MODE}"
            missing=1
          fi
          if [ "$missing" -ne 0 ]; then
            exit 1
          fi
          if [ -n "${GROQ_API_KEY:-}" ] && [ "${OPENAI_BASE_URL}" = "https://api.openai.com/v1" ]; then
            echo "GROQ_API_KEY is set but OPENAI_BASE_URL is still the OpenAI default. Set LLM_BASE_URL or GROQ_BASE_URL to https://api.groq.com/openai/v1."
            exit 1
          fi

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install dependencies
        run: pip install -r requirements.txt

      - name: Run bot cycle
        run: python main.py --once

      - name: Summarize posting result
        shell: bash
        run: |
          if git diff --quiet -- data; then
            {
              echo "## Telegram Content Bot"
              echo
              echo "No new data state changed in this run."
              echo
              echo "That usually means there were no fresh items and no due answer reveals to send."
            } >> "$GITHUB_STEP_SUMMARY"
          else
            {
              echo "## Telegram Content Bot"
              echo
              echo "Bot state changed in this run."
              echo
              echo '```'
              git diff --numstat -- data
              echo '```'
            } >> "$GITHUB_STEP_SUMMARY"
          fi

      - name: Commit updated posted-article state
        shell: bash
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add data
          if git diff --staged --quiet; then
            echo "No state changes to commit."
            exit 0
          fi
          git commit -m "chore: update telegram bot state [skip ci]"
          git push
